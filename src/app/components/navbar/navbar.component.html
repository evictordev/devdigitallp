<header class="nav" [class.solid]="solid() || open()">
  <div class="nav__in">
    <a class="nav__brand" routerLink="/" fragment="inicio" aria-label="Dev Digital — início" (click)="close()">
      <img src="/logo/logonavbar.png" alt="" width="34" height="30" />
      <span>Dev Digital</span>
    </a>

    <nav class="nav__links" id="menu" [class.open]="open()" aria-label="Principal">
      @for (l of links; track l.id) {
        <a routerLink="/" [fragment]="l.id" [class.on]="active() === l.id" (click)="close()">{{ l.label }}</a>
      }
      <a class="btn nav__cta" routerLink="/" fragment="contato" (click)="close()">Pedir um projeto</a>
    </nav>

    <button
      type="button"
      class="nav__toggle"
      [attr.aria-expanded]="open()"
      aria-controls="menu"
      aria-label="Abrir menu"
      (click)="open.set(!open())"
    >
      <span></span><span></span>
    </button>
  </div>
</header>
